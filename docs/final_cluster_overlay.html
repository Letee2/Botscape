        <script>
            function togglePanel() {
                var panel = document.getElementById('campaign-panel');
                var content = document.getElementById('p-content');
                var btn = document.getElementById('toggle-btn');
                var title = document.getElementById('panel-title');
                if (panel.classList.contains('minimized')) {
                    panel.classList.remove('minimized');
                    btn.innerHTML = '×'; title.style.display = 'block';
                    setTimeout(() => { content.style.opacity = '1'; }, 200);
                } else {
                    panel.classList.add('minimized');
                    btn.innerHTML = '☰'; title.style.display = 'none';
                    content.style.opacity = '0';
                }
            }
            setTimeout(function() {
                setInterval(function(){
                    var nodes = network.body.data.nodes.get();
                    var updates = [];
                    nodes.forEach(function(n){
                        if(n.shape === 'star'){
                            var pulse = 40 + (Math.sin(Date.now()/200) * 5);
                            updates.push({id:n.id, size: pulse});
                        }
                    });
                    if(updates.length > 0) network.body.data.nodes.update(updates);
                }, 50);
            }, 1000);
        </script>
